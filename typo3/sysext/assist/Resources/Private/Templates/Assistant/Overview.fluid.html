<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <f:be.pageRenderer includeJavaScriptModules="{0: '@typo3/assist/assistant-management.js'}" />

    <h1><f:translate id="title" domain="assist.modules.assist_assistant"/></h1>

    <f:if condition="{siteIdentifier}">
        <f:then>
            <p><f:translate id="siteLabel" domain="assist.modules.assist_assistant"/>: <strong>{siteIdentifier}</strong></p>
        </f:then>
        <f:else>
            <f:be.infobox state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}">
                <f:translate id="noSiteSelected" domain="assist.modules.assist_assistant"/>
            </f:be.infobox>
        </f:else>
    </f:if>

    <f:if condition="{assistants -> f:count()}">
        <f:then>
            <div class="table-fit" data-assistant-management data-site-identifier="{siteIdentifier}" data-assistant-models="{assistantModels}">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate id="column.identifier" domain="assist.modules.assist_assistant"/></th>
                            <th><f:translate id="column.capabilities" domain="assist.modules.assist_assistant"/></th>
                            <th><f:translate id="column.handler" domain="assist.modules.assist_assistant"/></th>
                            <th><f:translate id="column.triggers" domain="assist.modules.assist_assistant"/></th>
                            <f:if condition="{siteIdentifier}">
                                <th><f:translate id="column.model" domain="assist.modules.assist_assistant"/></th>
                            </f:if>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{assistants}" as="assistant">
                            <tr>
                                <td>{assistant.identifier}</td>
                                <td>
                                    <f:for each="{assistant.capabilities}" as="capability">
                                        <span class="badge badge-secondary">{capability.value}</span>
                                    </f:for>
                                </td>
                                <td><code>{assistant.handler}</code></td>
                                <td>
                                    <f:for each="{assistant.trigger.types}" as="triggerType" iteration="iterator">
                                        <span class="badge badge-secondary">{triggerType}</span>
                                    </f:for>
                                </td>
                                <f:if condition="{siteIdentifier}">
                                    <td>
                                        <select class="form-select form-select-sm"
                                                data-action="select-model"
                                                data-assistant-identifier="{assistant.identifier}">
                                            <option value="">Loading...</option>
                                        </select>
                                    </td>
                                </f:if>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <f:be.infobox state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}">
                <f:translate id="noAssistantsRegistered" domain="assist.modules.assist_assistant"/>
            </f:be.infobox>
        </f:else>
    </f:if>
</f:section>

</html>
