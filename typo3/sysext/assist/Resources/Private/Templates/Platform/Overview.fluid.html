<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate id="title" domain="assist.modules.assist_platform"/></h1>

    <f:if condition="{siteIdentifier}">
        <f:then>
            <p><f:translate id="siteLabel" domain="assist.modules.assist_platform"/>: <strong>{siteIdentifier}</strong></p>
        </f:then>
        <f:else if="{platforms -> f:count()}">
            <p><f:translate id="siteLabel" domain="assist.modules.assist_platform"/>: <strong>default fallback</strong></p>
        </f:else>
        <f:else>
            <f:be.infobox state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}">
                <f:translate id="noSiteSelected" domain="assist.modules.assist_platform"/>
            </f:be.infobox>
        </f:else>
    </f:if>

    <f:if condition="{platforms -> f:count()}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate id="column.name" domain="assist.modules.assist_platform"/></th>
                            <th><f:translate id="column.package" domain="assist.modules.assist_platform"/></th>
                            <th><f:translate id="column.availability" domain="assist.modules.assist_platform"/></th>
                            <th><f:translate id="column.baseUrl" domain="assist.modules.assist_platform"/></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{platforms}" as="platform">
                            <tr>
                                <td>{platform.name}</td>
                                <td><code>{platform.package}</code></td>
                                <td>
                                    <f:switch expression="{platform.availability.value}">
                                        <f:case value="enabled">
                                            <span class="badge badge-success"><f:translate id="availability.enabled" domain="assist.modules.assist_platform"/></span>
                                        </f:case>
                                        <f:case value="disabled">
                                            <span class="badge badge-warning"><f:translate id="availability.disabled" domain="assist.modules.assist_platform"/></span>
                                        </f:case>
                                        <f:case value="unavailable">
                                            <span class="badge badge-danger"><f:translate id="availability.unavailable" domain="assist.modules.assist_platform"/></span>
                                        </f:case>
                                    </f:switch>
                                </td>
                                <td>{platform.options.baseUrl}</td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <f:be.infobox state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}">
                <f:translate id="noPlatformsConfigured" domain="assist.modules.assist_platform"/>
            </f:be.infobox>
        </f:else>
    </f:if>
</f:section>

</html>
