<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate id="title" domain="assist.modules.assist_prompts"/></h1>
    <f:if condition="{pageId}">
        <f:then>
            <p>Selected page: {pageId}</p>
        </f:then>
        <f:else>
            <p>Please select a page from the page tree.</p>
        </f:else>
    </f:if>
</f:section>

</html>
